name: Tegami PR Preview

# Reusable. The caller keeps the pull_request trigger, the draft check and
# the workflow name "Tegami PR Preview", which Tegami PR Comment watches.
# The github context is the caller's, so checkout gets the pull request.
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner labels as JSON, for example "ubuntu-latest" or ["self-hosted","arm64","linux"]'
        type: string
        default: '"ubuntu-latest"'
      setup-commands:
        description: Shell commands to run before nub install, for example native packages
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preview:
    name: Build release preview
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.6
          node-version-file: .nvmrc
          cache-dependency-path: nub.lock

      - name: Run setup commands
        if: inputs.setup-commands != ''
        run: ${{ inputs.setup-commands }}

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Build release preview
        run: nub run tegami pr preview --artifact tegami-pr-preview.md

      - name: Upload release preview
        uses: actions/upload-artifact@v7
        with:
          name: tegami-pr-preview
          path: tegami-pr-preview.md
          if-no-files-found: error
          retention-days: 1
